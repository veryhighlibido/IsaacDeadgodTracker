[package]
name = "isaac-deadgod-tracker"
version = "4.0.0"
edition = "2021"
rust-version = "1.77"

[lib]
name = "tracker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", default-features = false, features = ["wry", "common-controls-v6", "dynamic-acl", "tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["fs", "cors"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
notify = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
rust-embed = "8"
mime_guess = "2"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Diagnostics_ToolHelp"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
